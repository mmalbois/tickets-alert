name: Surveillance Galleria Borghese

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: borghese-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer Playwright
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Lancer la surveillance
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Sauvegarder le nouvel etat
        run: |
          git config user.name "Borghese Alert"
          git config user.email "borghese-alert@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Aucun changement dans state.json"
            exit 0
          fi

          git commit -m "Update availability"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
